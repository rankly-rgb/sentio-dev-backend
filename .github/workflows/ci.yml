name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for migration version collisions
        run: |
          cd supabase/migrations
          dupes=$(ls -1 *.sql | grep -oE '^[0-9]{14}' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "Supabase keys a migration by its 14-digit version number only, not the filename."
            echo "Two files sharing a version number will apply cleanly in git but collide on"
            echo "'supabase db push' (duplicate primary key in schema_migrations) — usually caused"
            echo "by two branches independently authoring a migration on the same day."
            echo ""
            echo "Colliding version(s):"
            for v in $dupes; do
              echo "  $v:"
              ls -1 "${v}"*.sql | sed 's/^/    /'
            done
            exit 1
          fi
          echo "No migration version collisions."
      - name: Check for hardcoded service_role JWT literals in migrations
        run: |
          # Lot 1 (2026-08-13, security audit) : trois migrations historiques
          # (20260531000001/3/5) committent la clé service_role JWT en clair
          # dans cron.job.command / net.http_post — un secret compromis en
          # attente de rotation (voir 20260813000003_security_definer_lockdown.sql).
          # Ce garde-fou empêche une 4e occurrence future : réécrire l'historique
          # git n'est pas une option (idempotence des migrations), mais aucune
          # nouvelle occurrence ne doit apparaître. Allowlist des 3 fichiers
          # historiques, par chemin exact.
          ALLOWLIST="supabase/migrations/20260531000001_playbook_activate_trigger.sql
          supabase/migrations/20260531000003_fix_trigger_positional_params.sql
          supabase/migrations/20260531000005_fix_trigger_execution_source.sql"

          # Pattern JWT générique (header.payload.signature, base64url), pas le
          # littéral exact de la clé compromise — attrape aussi une future clé
          # différente committée par erreur, pas seulement une répétition de
          # celle-ci.
          PATTERN='eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+'

          violations=""
          for f in supabase/migrations/*.sql; do
            if grep -qE "$PATTERN" "$f"; then
              if ! echo "$ALLOWLIST" | grep -qxF "$f"; then
                violations="$violations $f"
              fi
            fi
          done

          if [ -n "$violations" ]; then
            echo "Hardcoded JWT literal(s) found outside the allowlist:"
            for v in $violations; do echo "  $v"; done
            echo ""
            echo "Never commit a service_role/JWT literal to a migration file — read it from"
            echo "Supabase Vault at call time instead (see cron_dispatch_via_vault, "
            echo "on_playbook_activate in 20260813000003_security_definer_lockdown.sql)."
            exit 1
          fi
          echo "No hardcoded JWT literals outside the allowlist."
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x
      - name: Deno check on all Edge Functions — ratchet (a14)
        # Incident 2026-08-13 (Lot P1) : ts.transpileModule (utilisé jusqu'ici
        # faute de Deno dans cet environnement) fait une passe grammaticale
        # seule — un `continue` visant une boucle déplacée dans une IIFE
        # (frontière de fonction, cible de saut invalide) l'a traversée sans
        # broncher et a cassé calculate-scores en production (worker boot
        # error, détecté seulement après déploiement). `deno check` est le
        # runtime cible réel de ces fonctions — c'est lui qui doit faire
        # échouer le build, pas un pis-aller Node.
        #
        # Atterri d'abord en soft (::warning:: inconditionnel) le temps de
        # cette même soirée — la toute première exécution de `deno check` sur
        # ce repo (jamais disponible dans aucun environnement précédent,
        # noté "toujours indisponible" dans une douzaine d'entrées de
        # CHANGELOG_STABILITY.md) a révélé des erreurs de type PRÉ-EXISTANTES,
        # sans rapport avec l'incident de ce soir. Correction (tour 5,
        # 2026-08-13) : passé en cliquet plutôt que soft permanent — soft
        # laissait la dette grandir sans jamais le signaler. `.github/a14-baseline.json`
        # fige la liste exacte des fonctions déjà en échec et leur nombre
        # d'erreurs actuel (`max_errors`), capturé depuis la seule exécution
        # réelle de `deno check` sur ce repo (run 31740110673, commit
        # 627f0def) — corrige au passage le chiffre "11 fonctions" annoncé
        # à tort dans le message de commit de PR #66 et dans l'issue #67 :
        # le compte réel est 14 (account-summary, accounts-api et
        # calculate-scores manquaient).
        #
        # Règle : toute fonction absente du baseline qui échoue → hard fail
        # (régression zéro-tolérance). Toute fonction du baseline dont le
        # nombre d'erreurs dépasse son max_errors enregistré → hard fail
        # (aggravation — on ne diffe pas le message exact, ce qui serait
        # fragile face aux versions futures de deno ; un comptage d'erreurs
        # strictement croissant est un signal fiable d'aggravation même sans
        # diff textuel exact). Toute fonction du baseline dont le nombre
        # d'erreurs est
        # <= max_errors → warning seul (dette déjà connue, non bloquante).
        # Toute fonction du baseline qui passe désormais à 0 erreur → warning
        # invitant à la retirer du baseline (jamais automatique — "une
        # fonction sortie du baseline n'y rentre jamais plus").
        run: |
          set -uo pipefail
          HARD_FAIL=0
          RESULTS=/tmp/a14-results.txt
          : > "$RESULTS"
          # Two prior CI runs on this exact step (31746115934, 31746496952)
          # both failed with exit 1, but every log-retrieval path available
          # (plain fetch, failed_only fetch, waiting 3+ minutes for archival
          # lag) returned a raw log with a hard gap between this step's own
          # ##[endgroup] and "Process completed with exit code 1" — the
          # entire per-function loop output missing, prefixed or not. Cause
          # unconfirmed (suspected: GitHub batching many ::error::/::warning::
          # commands in a tight loop drops the surrounding buffer from the
          # downloadable log, not just the annotation lines themselves).
          # RESULTS is the reliable channel: written to a real file, uploaded
          # as a build artifact by the next step regardless of outcome.
          for dir in supabase/functions/*/; do
            fn=$(basename "$dir")
            [ "$fn" = "_shared" ] && continue
            [ -f "${dir}index.ts" ] || continue

            deno check "${dir}index.ts" > /tmp/deno-check-output.txt 2>&1
            CHECK_EXIT=$?

            BASELINE_MAX=$(jq -r --arg fn "$fn" '.functions[$fn].max_errors // empty' .github/a14-baseline.json)

            if [ "$CHECK_EXIT" = "0" ]; then
              if [ -n "$BASELINE_MAX" ]; then
                echo "[a14] BASELINE_STALE $fn — now passes deno check but is still listed in .github/a14-baseline.json. Remove its entry in this PR." | tee -a "$RESULTS"
                echo "::warning::a14_baseline_stale — $fn now passes deno check but is still listed in .github/a14-baseline.json. Remove its entry in this PR."
              else
                echo "[a14] ok $fn" | tee -a "$RESULTS"
              fi
              continue
            fi

            # Failed. Each error starts its own "error: TS<code> [ERROR]: ..." line;
            # deno omits the "Found N errors." summary line when there's exactly 1.
            ERR_COUNT=$(grep -c '^error: TS[0-9]* \[ERROR\]' /tmp/deno-check-output.txt || true)
            [ "$ERR_COUNT" = "0" ] && ERR_COUNT=1

            if [ -z "$BASELINE_MAX" ]; then
              echo "[a14] REGRESSION $fn — fails deno check and is NOT in the a14 baseline. New regression, never tolerated." | tee -a "$RESULTS"
              cat /tmp/deno-check-output.txt | tee -a "$RESULTS"
              echo "::error::a14_deno_check_regression — $fn fails deno check and is NOT in the a14 baseline. New regression, never tolerated."
              HARD_FAIL=1
            elif [ "$ERR_COUNT" -gt "$BASELINE_MAX" ]; then
              echo "[a14] WORSENED $fn — has $ERR_COUNT errors, baseline allows at most $BASELINE_MAX." | tee -a "$RESULTS"
              cat /tmp/deno-check-output.txt | tee -a "$RESULTS"
              echo "::error::a14_deno_check_worsened — $fn has $ERR_COUNT errors, baseline allows at most $BASELINE_MAX. Ratchet violated — a new or additional error was introduced."
              HARD_FAIL=1
            else
              echo "[a14] known_debt $fn ($ERR_COUNT/$BASELINE_MAX errors, tracked in .github/a14-baseline.json, see issue #67)" | tee -a "$RESULTS"
              echo "::warning::a14_deno_check_known_debt — $fn ($ERR_COUNT/$BASELINE_MAX errors, tracked in .github/a14-baseline.json, see issue #67)"
            fi
          done
          if [ "$HARD_FAIL" = "1" ]; then
            echo "[a14] RATCHET VIOLATED — see per-function output above and the a14-results build artifact." | tee -a "$RESULTS"
            echo "::error::a14 ratchet violated — see above, or download the a14-results artifact from this run. Either fix the regression, or if this error was already tracked, update .github/a14-baseline.json in the same PR with justification."
            exit 1
          fi
          echo "[a14] ratchet held — no function outside the baseline failed, no baseline function worsened." | tee -a "$RESULTS"
      - name: Upload a14 results (always, even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a14-results
          path: /tmp/a14-results.txt
          retention-days: 7
          if-no-files-found: warn
      - name: Security audit
        run: npm audit --audit-level=critical --omit=dev
      - name: TypeScript check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Run tests
        run: npm run test
      - name: Seed script smoke check (dry-run)
        # Lot 7 (2026-08-13, housekeeping) — two findings fixed together:
        #
        # 1. scripts/ is excluded from tsconfig.json's `include` (see the
        #    exclude list), so `npm run typecheck` gives this file zero
        #    coverage — a broken import or syntax error here would go
        #    undetected indefinitely.
        # 2. `npm run seed:insertion-check` (and its sibling
        #    seed:churn-validation) was silently broken since introduction:
        #    `tsx` was never a declared dependency, only ever exercised via
        #    an ad-hoc `npx tsx ...` in each PR's own verification session
        #    (which downloads tsx on demand) — `npm run seed:insertion-check`
        #    itself failed with `sh: 1: tsx: not found` (exit 127). Fixed by
        #    adding tsx to devDependencies (package.json) rather than
        #    bypassing npm run here.
        #
        # `--dry-run` is the only mode that needs neither STRIPE_SEED_KEY
        # nor SEED_EXPECTED_ACCOUNT_ID and makes zero external API calls
        # (see the script's own docstring) — deliberately narrower than
        # running the real seed, which would require a live Stripe
        # test-mode secret in CI and would create unbounded Stripe test
        # objects on every push/PR. The real --seed/--cleanup cycle stays a
        # manual, documented procedure (see the script's header). This step
        # only proves the CLI entry point still loads and executes without
        # throwing.
        run: npm run seed:insertion-check -- --dry-run --seed --cleanup
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-key
