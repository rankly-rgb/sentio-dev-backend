name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  workflow_dispatch:

# Pièce 1 de l'infrastructure de fin de chantier (2026-08-15).
#
# Ce workflow EST le pipeline de déploiement du guide : il fait déjà
# link → db push → functions deploy → smoke test a13 en dernière marche,
# plus les assertions a10/a11 et les assertions data-truth. Un second
# workflow `deploy.yml` n'a donc pas été créé — deux pipelines déclenchés
# par le même push se seraient couru après sur `db push` et
# `functions deploy`, et remplacer celui-ci par la version courte du guide
# aurait fait perdre toutes les assertions.
#
# Le seul élément du guide qui manquait est ce bloc `concurrency`. Sans lui,
# deux merges rapprochés sur `main` lancent deux runs en parallèle : deux
# `supabase db push` concurrents sur la même base, et deux
# `functions deploy` dont l'ordre d'arrivée décide de ce qui est live.
# `cancel-in-progress: false` est délibéré : on ne coupe JAMAIS un
# déploiement en cours (une migration à moitié appliquée est pire que
# d'attendre) — le second run patiente et s'exécute après.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref $SUPABASE_PROJECT_REF

      - name: Repair remote-only migration versions
        # Versions présentes en remote sans fichier local (migrations appliquées
        # directement sur le projet). Les marquer comme "reverted" dans l'historique
        # pour que db push ne bloque pas sur le mismatch.
        run: |
          REMOTE_ONLY=$(supabase migration list 2>/dev/null | awk -F'|' '
            /[0-9]{14}/ {
              local=$1; gsub(/[ \t]/, "", local)
              remote=$2; gsub(/[ \t]/, "", remote)
              if (local == "" && remote ~ /^[0-9]{14}$/) print remote
            }
          ')
          if [ -n "$REMOTE_ONLY" ]; then
            echo "Remote-only versions à réparer :"
            echo "$REMOTE_ONLY"
            while IFS= read -r version; do
              [ -n "$version" ] && supabase migration repair --status reverted "$version"
            done <<< "$REMOTE_ONLY"
          else
            echo "Aucune version remote-only — historique cohérent."
          fi

      - name: Push database migrations
        id: push_migrations
        run: supabase db push --include-all

      - name: Assert no migration version drift (a10)
        # Lot P0 (2026-08-13) — la leçon des quatre jours d'invisibilité :
        # mcp__Supabase__apply_migration génère sa propre version horodatée à
        # l'appel, décorrélée du nom de fichier git. Une migration appliquée
        # ainsi laisse une entrée fantôme dans schema_migrations qu'aucun
        # fichier local ne référence — "Repair remote-only migration
        # versions" ci-dessus est une auto-guérison best-effort (parse
        # `supabase migration list`), pas une garantie. Cette assertion est
        # la garantie : une divergence devient une erreur de build explicite,
        # jamais une découverte fortuite des jours plus tard. Voir CLAUDE.md
        # ("Migrations — jamais apply_migration") pour l'interdiction que
        # cette assertion fait respecter.
        run: |
          set -euo pipefail
          LOCAL_VERSIONS=$(ls supabase/migrations/*.sql | xargs -n1 basename | grep -oE '^[0-9]{14}' | sort -u)
          QUERY="SELECT version FROM supabase_migrations.schema_migrations ORDER BY version;"
          SQL_BODY=$(jq -Rcs '{"query":.}' <<< "$QUERY")
          RESULT=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$SQL_BODY")
          CODE=$(printf '%s' "$RESULT" | tail -1)
          BODY=$(printf '%s' "$RESULT" | head -1)
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "::error::a10_migration_version_drift — Management API returned HTTP $CODE, cannot verify migration drift. Body: $BODY"
            exit 1
          fi
          REMOTE_VERSIONS=$(printf '%s' "$BODY" | jq -r '.[].version' | sort -u)
          MISSING_LOCAL=$(comm -23 <(echo "$REMOTE_VERSIONS") <(echo "$LOCAL_VERSIONS"))
          MISSING_REMOTE=$(comm -13 <(echo "$REMOTE_VERSIONS") <(echo "$LOCAL_VERSIONS"))
          if [ -n "$MISSING_LOCAL" ] || [ -n "$MISSING_REMOTE" ]; then
            echo "::error::a10_migration_version_drift — supabase_migrations.schema_migrations and supabase/migrations/ have diverged."
            [ -n "$MISSING_LOCAL" ] && echo "Versions tracked remotely with no matching file in supabase/migrations/: $MISSING_LOCAL"
            [ -n "$MISSING_REMOTE" ] && echo "Migration files with no matching tracked version: $MISSING_REMOTE"
            echo "This is the exact failure class that broke 'supabase db push' silently from 2026-08-09 to 2026-08-13 — see CLAUDE.md."
            exit 1
          fi
          echo "a10: no migration version drift ($(echo "$LOCAL_VERSIONS" | wc -l | tr -d ' ') versions, local and remote match exactly)."

      - name: Verify accounts_with_priority has no column drift
        # Incident 2026-08-05 (docs/RUNBOOK.md "Deploying backend ahead of
        # its matching frontend") : accounts_with_priority is `SELECT a.*
        # FROM accounts a` — Postgres freezes `*` into an explicit column
        # list at CREATE VIEW time, so a column added to accounts by a LATER
        # migration silently never appears in the view until it's recreated.
        # The migration-time DO block in 20260805000001 only catches drift
        # that already exists when THAT migration runs — it can't see a
        # future migration that adds a column without recreating the view.
        # This step is the structural guard for that future case: it runs
        # after every deploy, against the real post-migration schema.
        run: |
          set -euo pipefail
          DRIFT_QUERY="SELECT string_agg(c.column_name, ', ') FROM information_schema.columns c WHERE c.table_schema='public' AND c.table_name='accounts' AND c.column_name NOT IN (SELECT column_name FROM information_schema.columns WHERE table_schema='public' AND table_name='accounts_with_priority');"
          SQL_BODY=$(jq -Rcs '{"query":.}' <<< "$DRIFT_QUERY")
          RESULT=$(curl -s -w "\n%{http_code}" -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$SQL_BODY")
          CODE=$(printf '%s' "$RESULT" | tail -1)
          BODY=$(printf '%s' "$RESULT" | head -1)
          if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
            echo "::warning::Management API query returned HTTP $CODE — could not verify view drift, not blocking deploy"
            echo "Body: $BODY"
            exit 0
          fi
          MISSING=$(printf '%s' "$BODY" | jq -r '.[0].string_agg // empty')
          if [ -n "$MISSING" ]; then
            echo "::error::accounts_with_priority is missing accounts column(s): $MISSING"
            echo "SELECT * views freeze their column list at CREATE VIEW time — a migration adding a column to accounts must recreate this view in the same series. See docs/RUNBOOK.md."
            exit 1
          fi
          echo "accounts_with_priority: no column drift."

      - name: Data-truth assertions
        # Lot 2 (2026-08-13, exécution autonome post-audit) : chaque requête
        # ci-dessous prévient un incident réel déjà survenu sur ce projet
        # (voir docs/CHANGELOG_STABILITY.md). mode=hard échoue le déploiement
        # si la requête renvoie des lignes ; mode=soft n'émet qu'un
        # ::warning:: — réservé aux gardes dont la donnée nécessaire n'existe
        # pas encore (assertions 4/5, en attente des Lots 4/6).
        #
        # Une assertion volontairement fausse (a0_negative_control) prouve que
        # le mécanisme échoue réellement avant qu'on lui fasse confiance — le
        # dispositif de tests de ce projet a déjà été vert pendant plusieurs
        # incidents (cf. entrée "mrr_movements — upsert cassé", 2026-08-08).
        run: |
          set -euo pipefail

          run_query() {
            local NAME="$1" MODE="$2" SQL="$3"
            local SQL_BODY RESULT CODE BODY COUNT
            SQL_BODY=$(jq -Rcs '{"query":.}' <<< "$SQL")
            RESULT=$(curl -s -w "\n%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$SQL_BODY")
            CODE=$(printf '%s' "$RESULT" | tail -1)
            BODY=$(printf '%s' "$RESULT" | head -1)
            if [ "$CODE" != "200" ] && [ "$CODE" != "201" ]; then
              echo "::warning::$NAME — Management API returned HTTP $CODE, could not verify. Body: $BODY"
              return 0
            fi
            COUNT=$(printf '%s' "$BODY" | jq -r '.[0].n // 0')
            if [ "$COUNT" != "0" ]; then
              if [ "$MODE" = "hard" ]; then
                echo "::error::$NAME — expected 0, got $COUNT. Body: $BODY"
                echo "FAIL_HARD=1" >> "$GITHUB_ENV"
              else
                echo "::warning::$NAME (pending) — expected 0, got $COUNT. Body: $BODY"
              fi
            else
              echo "$NAME: ok (0 rows)"
            fi
          }

          # Negative-control proof that run_query actually fails when it
          # should (a harness that's always green is worse than no harness —
          # see docs/CHANGELOG_STABILITY.md, "mrr_movements — upsert cassé").
          # NOT run here: a query engineered to return a row would gate every
          # future deploy on a permanently-failing assertion. Proven instead
          # by local simulation before this workflow was merged (same
          # run_query logic, `select 1 as n` with mode=hard set FAIL_HARD=1
          # as expected; removed once confirmed) — see the PR description for
          # the exact commands run.

          # a1 — Lot 1 guard: no SECURITY DEFINER function reachable by anon/PUBLIC.
          run_query "a1_security_definer_exposed" "hard" "
            select count(*) as n from (
              select p.proname from pg_proc p join pg_namespace n on n.oid=p.pronamespace
              where n.nspname='public' and p.prosecdef and has_function_privilege('anon', p.oid, 'EXECUTE')
              union
              select routine_name from information_schema.routine_privileges
              where routine_schema='public' and grantee='PUBLIC'
                and routine_name in (select p.proname from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.prosecdef)
            ) x;"

          # a2 — hardcoded JWT literals: static file check, already enforced
          # in ci.yml (build-and-test job), not duplicated here as SQL.

          # a3 — delinquency audit (2026-08-06): no is_delinquent account left in band 'low'.
          run_query "a3_delinquent_in_low_band" "hard" "
            select count(*) as n from accounts where is_delinquent = true and churn_risk_band = 'low';"

          # a4 — Lot 4 guard: a 'new' movement dated today for an account
          # whose subscription has a known stripe_created_at more than 7
          # days old must be marked provenance != 'live' (falls back to
          # 'estimated' only if the real date was genuinely unavailable at
          # write time) — never a silent regression to today's date despite
          # good data existing.
          run_query "a4_new_movement_misdated" "hard" "
            select count(*) as n from mrr_movements m
            join subscriptions s on s.account_id = m.account_id
            where m.movement_type = 'new' and m.provenance = 'live'
              and m.movement_date = current_date
              and s.stripe_created_at < now() - interval '7 days';"

          # a5 — Lot 6 guard (mrr_movements generation), pending until backfill lands.
          run_query "a5_synced_org_with_zero_movements" "soft" "
            select count(*) as n from (
              select a.organization_id from data_syncs d
              join accounts a on a.organization_id = d.organization_id
              where d.sync_status = 'completed' and d.sync_source = 'stripe'
              group by a.organization_id
              having count(distinct a.id) > 0
                 and count(distinct a.id) > (select count(*) from mrr_movements m where m.organization_id = a.organization_id)
            ) x;"

          # a6 — 'no data ≠ neutral data' (S1): mrr unavailable must never look like a complete revenue_dynamics dimension.
          #
          # Known, accepted exception to S1 within this same dimension (Lot 7
          # housekeeping, 2026-08-13, issue #56, not fixed here): calcExpansionSignalScore
          # (_shared/scoring.ts:234-236) returns 60, not null, when no expansion
          # movement occurred in the last 6 months — the one revenue_dynamics
          # sub-signal that doesn't follow the null-when-absent convention this
          # assertion otherwise protects. Not an untracked bug: documented,
          # deliberate (see the function's own comment), and deferred to #56
          # pending a before/after score-distribution review, not fixed as a
          # drive-by here. This assertion is unaffected — it checks mrr_status,
          # not expansion_signal_score.
          run_query "a6_unavailable_mrr_with_complete_score" "hard" "
            select count(*) as n from accounts
            where mrr_status = 'unavailable' and score_breakdown->'revenue_dynamics'->>'status' = 'complete';"

          # a7 — MAX_PAGES=50 (sync-stripe/index.ts) forward-looking capacity check:
          # 5000 objects/resource cap, warn well before an org gets there rather
          # than after truncation already happened silently.
          run_query "a7_approaching_pagination_cap" "hard" "
            select count(*) as n from (
              select organization_id from accounts group by 1 having count(*) >= 4500
              union all
              select a.organization_id from subscriptions s join accounts a on a.id = s.account_id group by 1 having count(*) >= 4500
              union all
              select a.organization_id from invoices i join accounts a on a.id = i.account_id group by 1 having count(*) >= 4500
            ) x;"

          # a8 — Lot 3 (webhook diagnostic, 2026-08-13): a connected org whose
          # webhook endpoint has gone silent for 7+ days after previously
          # receiving traffic. soft: this dev project has never had real
          # Stripe webhook traffic (see docs/CHANGELOG_STABILITY.md, "Lot 3"),
          # so warn rather than block until that changes.
          run_query "a8_org_webhook_gone_stale" "soft" "
            select count(*) as n from (
              select organization_id, max(received_at) as last_received
              from webhook_receipts
              where signature_valid = true and organization_id is not null
              group by organization_id
              having max(received_at) < now() - interval '7 days'
            ) x;"

          # a9 — Lot 5 guard (2026-08-13, #35, applyDelinquencyBandFloor):
          # an account delinquent for >= 45 known days must be floored to
          # 'critical', regardless of its raw signal-based band. soft: this
          # dev project's accounts.delinquent_since is brand new (Lot 5 just
          # landed) — 0 rows have a known date yet, nothing to compute a
          # duration from until the next sync-stripe run populates it.
          run_query "a9_delinquent_45d_not_critical" "soft" "
            select count(*) as n from accounts
            where is_delinquent = true and churn_risk_band != 'critical' and churn_risk_band != 'churned'
              and delinquent_since is not null
              and delinquent_since <= current_date - interval '45 days';"

          # a12 — Lot P1 (2026-08-13) : calculate-scores traite les orgs
          # séquentiellement — un org bloqué (hang, pas une exception : voir
          # d3dc9223, deux fois le même jour, auto-échoué par self-monitor
          # seulement après 15 min) empêchait silencieusement tous les orgs
          # suivants d'être scorés du tout. Un org jamais démarré et un org
          # réussi étaient indiscernables sans cette assertion. "Connecté" =
          # a au moins un sync Stripe complété une fois ; le plancher de 48h
          # laisse une marge large au-delà du cron quotidien + retries.
          #
          # mode=soft pour ce premier atterrissage : vérifié en direct à 5
          # (le hang de d3dc9223 CE MÊME JOUR, avant que le correctif
          # d'isolation ci-dessus ne soit live — passer hard immédiatement
          # aurait cassé ce déploiement lui-même, l'ironie exacte de ce que
          # ce lot corrige). À repasser hard dans un suivi rapide dès qu'un
          # run calculate-scores propre, avec le correctif d'isolation
          # déployé, confirme 0 — pas ici, tant que ce correctif n'est pas
          # encore live pour le produire.
          run_query "a12_org_missing_recent_scoring_run" "soft" "
            select count(*) as n from (
              select o.id from organizations o
              where o.is_active = true
                and exists (select 1 from data_syncs d where d.organization_id = o.id and d.sync_source = 'stripe' and d.sync_status = 'completed')
                and not exists (
                  select 1 from data_syncs d2
                  where d2.organization_id = o.id and d2.sync_source = 'scoring' and d2.sync_status = 'completed'
                    and d2.completed_at > now() - interval '48 hours'
                )
            ) x;"

          # a15 — incident 2026-08-13, piste A investiguée (grants perdus sur
          # accounts_with_priority après PR #58) : écartée dans les faits pour
          # cet incident précis (GRANTs intacts, vérifiés en direct), mais le
          # risque structurel reste réel — la posture Lot 1 "révoquer par
          # défaut" rend toute vue/table RLS recréée par DROP+CREATE (au lieu
          # de CREATE OR REPLACE) silencieusement inaccessible à authenticated
          # tant que personne ne pense à ré-accorder le GRANT. Couvre les
          # tables avec RLS activée (relrowsecurity) ET les vues (une vue ne
          # porte jamais relrowsecurity elle-même, security_invoker délègue à
          # la table sous-jacente — ratée par le premier filtre seul).
          run_query "a15_rls_object_missing_authenticated_grant" "hard" "
            select count(*) as n from (
              select c.relname from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public' and c.relkind = 'r' and c.relrowsecurity = true
                and not exists (
                  select 1 from information_schema.role_table_grants g
                  where g.table_schema = 'public' and g.table_name = c.relname and g.grantee = 'authenticated'
                )
              union
              select c.relname from pg_class c
              join pg_namespace n on n.oid = c.relnamespace
              where n.nspname = 'public' and c.relkind = 'v'
                and not exists (
                  select 1 from information_schema.role_table_grants g
                  where g.table_schema = 'public' and g.table_name = c.relname and g.grantee = 'authenticated' and g.privilege_type = 'SELECT'
                )
            ) x;"

          # a18 — incident 2026-08-13, tour 6. a13 (the post-deploy HTTP smoke
          # test, below) always uses the same fixed account (org d3dc9223,
          # paying plan, trial concept doesn't apply to it) — it structurally
          # can never detect a trial-gating outage like tonight's: 9 orgs,
          # every core-product endpoint returning 402, a13 green throughout
          # because it never once asked a gated org. Two parts:
          #
          # 1. hard, cheap defensive check: no paying org (plan_type != 'free')
          #    should ever carry a state that would make it read as
          #    trial-expired — computeTrialStatus's precondition is a strict
          #    plan_type == 'free' check, so this should always be true by
          #    construction; this just makes sure nothing (a migration, a
          #    manual UPDATE, a future refactor) quietly breaks that
          #    precondition without anyone noticing.
          # 2. never silent (tour 6 instruction — "at minimum, publish the
          #    count of gated orgs on every deploy"): the count of
          #    plan_type='free' orgs whose trial_ends_at has already passed is
          #    ALWAYS printed below, whether 0 or not. Deliberately NOT a hard
          #    assertion on its own — an org genuinely reaching the end of its
          #    trial is expected, normal state, not an incident; hard-failing
          #    every future deploy the moment one trial expires would be
          #    wrong. What broke tonight wasn't gated orgs existing, it was
          #    that fact being invisible (a13 green, nobody told). This fixes
          #    the invisibility. Whether the gate itself is the right UX for
          #    a trial-ending prospect is a separate, explicitly-opened
          #    product question (see issue tracking the gate-design review).
          run_query "a18_paying_org_reads_as_trial_expired" "hard" "
            select count(*) as n from organizations
            where plan_type != 'free' and trial_ends_at is not null and trial_ends_at < now();"

          GATED_QUERY='select count(*) as n from organizations where plan_type = '"'"'free'"'"' and trial_ends_at is not null and trial_ends_at < now();'
          GATED_SQL_BODY=$(jq -Rcs '{"query":.}' <<< "$GATED_QUERY")
          GATED_RESULT=$(curl -s -X POST \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$GATED_SQL_BODY")
          GATED_COUNT=$(printf '%s' "$GATED_RESULT" | jq -r '.[0].n // "unknown"')
          echo "::notice::a18_trial_gated_orgs — $GATED_COUNT organization(s) currently plan_type='free' with an expired trial_ends_at (will receive 402 from every trial-gated endpoint). This count is informational, not a deploy blocker — see a18's comment in this workflow for why."
          echo "a18: $GATED_COUNT org(s) currently trial-gated." >> "$GITHUB_STEP_SUMMARY"

          # a19 — 2026-08-20 (PARKING_LOT.md "churn_risk_band FAUX") : an
          # account whose EVERY known subscription is 'canceled' must always
          # read churn_risk_band='churned' (D1, 2026-08-02) — never a live
          # band computed from its historical signals. This is exactly the
          # regression this assertion would have caught on 2026-08-15: commit
          # 462bf74 (per-org Promise.race timeout isolation, both here and in
          # sync-stripe/index.ts) let a timed-out org's abandoned scoring work
          # keep writing accounts/score_history after its run was already
          # marked failed, and a separate, unguarded fetch-error fallback in
          # prefetchScoringData (subscriptionsResult.error silently defaulting
          # to []) reclassified 218 fully-canceled accounts back to a live
          # band starting 2026-08-15. The fix (this same PR) guards every
          # write boundary behind the per-org 'aborted' flag in BOTH
          # calculate-scores/index.ts and sync-stripe/index.ts, and throws
          # instead of silently defaulting on a prefetch query failure.
          #
          # NULL band is deliberately excluded (not a violation) — an account
          # with fully-canceled subscriptions that has simply never been
          # scored yet is a different, unrelated state from one scored WRONG.
          #
          # mode=hard: this PR's own targeted backfill (scoped to exactly the
          # 217 accounts this query found — see PARKING_LOT.md) ran before
          # merge and brought this to 0, verified live via execute_sql
          # (accounts.churn_risk_band + segment_memberships both corrected,
          # not just the accounts row). Unlike a9/a12, not left pending —
          # this is the assertion that would have caught the 2026-08-15
          # regression the day it landed, so it ships hard from the start.
          run_query "a19_fully_canceled_account_not_churned_band" "hard" "
            select count(*) as n from accounts a
            where a.churn_risk_band is not null and a.churn_risk_band != 'churned'
              and exists (select 1 from subscriptions s where s.account_id = a.id)
              and not exists (select 1 from subscriptions s where s.account_id = a.id and s.status != 'canceled');"

          if [ "${FAIL_HARD:-0}" = "1" ]; then
            echo "::error::One or more hard data-truth assertions failed — see above."
            exit 1
          fi
          echo "All hard data-truth assertions passed."

      - name: Set Edge Function secrets
        # N'écrit que les secrets effectivement définis dans GitHub Secrets.
        # Évite d'écraser un secret existant avec une chaîne vide si le
        # GitHub Secret correspondant est absent.
        run: |
          ARGS=""
          [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]       && ARGS="$ARGS ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"
          [ -n "${{ secrets.STRIPE_SECRET_KEY }}" ]        && ARGS="$ARGS STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}"
          [ -n "${{ secrets.STRIPE_WEBHOOK_SECRET }}" ]    && ARGS="$ARGS STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}"
          # Lot V/P0 (2026-08-13) : STRIPE_BILLING_WEBHOOK_SECRET manquait de
          # cette liste — même en créant le GitHub Secret, il n'aurait jamais
          # été poussé vers Supabase. stripe-billing-webhook 500 sans lui
          # ("Server misconfigured") avant même d'écrire webhook_receipts.
          [ -n "${{ secrets.STRIPE_BILLING_WEBHOOK_SECRET }}" ] && ARGS="$ARGS STRIPE_BILLING_WEBHOOK_SECRET=${{ secrets.STRIPE_BILLING_WEBHOOK_SECRET }}"
          if [ -n "$ARGS" ]; then
            supabase secrets set $ARGS
          else
            echo "No secrets to update."
          fi

      - name: Deploy Edge Functions
        id: deploy_edge_functions
        # La sortie est capturée (tee) pour a11 : depuis que la CLI compare le
        # hash du bundle avant d'uploader, un push qui ne touche aucune source
        # de fonction affiche `No change found in Function: X` pour chacune et
        # n'écrit AUCUN `updated_at`. Le compte bundled/unchanged est ce qui
        # permet à a11 de distinguer ce no-op légitime d'un deploy qui n'a rien
        # fait pour une mauvaise raison (token vide, flag mal formé).
        run: |
          set -euo pipefail
          supabase functions deploy 2>&1 | tee /tmp/deploy-edge-functions.log

      - name: Schedule compute-peer-benchmarks (daily 02:00 UTC)
        # Récupère la service_role key via la Management API, puis crée/remplace
        # le job pg_cron via une query SQL. Idempotent.
        # Soft-fail avec warning si la clé est inaccessible (ne bloque pas le deploy).
        run: |
          set -euo pipefail

          # ── 1. Récupérer la service_role key ──────────────────────────
          RESP=$(curl -s -w "\n%{http_code}" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          HTTP_CODE=$(printf '%s' "$RESP" | tail -1)
          BODY=$(printf '%s' "$RESP" | head -1)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Management API /api-keys returned HTTP $HTTP_CODE — cron non configuré"
            echo "Body: $BODY"
            exit 0
          fi

          SERVICE_ROLE_KEY=$(printf '%s' "$BODY" \
            | jq -r '.[] | select(.name == "service_role") | .api_key')

          if [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::warning::service_role key introuvable dans la réponse — cron non configuré"
            exit 0
          fi

          FUNCTION_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/compute-peer-benchmarks"

          # ── 2. Helper : exécuter du SQL via la Management API ─────────
          run_sql() {
            local SQL_BODY
            SQL_BODY=$(jq -Rcs '{"query":.}' <<< "$1")
            RESULT=$(curl -s -w "\n%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$SQL_BODY")
            local CODE
            CODE=$(printf '%s' "$RESULT" | tail -1)
            local OUT
            OUT=$(printf '%s' "$RESULT" | head -1)
            echo "SQL HTTP $CODE : $OUT"
            [ "$CODE" = "200" ] || [ "$CODE" = "201" ]
          }

          # ── 3. Supprimer l'ancien job s'il existe ─────────────────────
          run_sql "select cron.unschedule('compute-peer-benchmarks-daily');" || true

          # ── 4. Créer le job pg_cron ───────────────────────────────────
          run_sql "select cron.schedule(
            'compute-peer-benchmarks-daily',
            '0 2 * * *',
            \$cmd\$
              select net.http_post(
                url        := '${FUNCTION_URL}',
                headers    := '{\"Content-Type\":\"application/json\",\"Authorization\":\"Bearer ${SERVICE_ROLE_KEY}\"}'::jsonb,
                body       := '{}'::jsonb
              ) as request_id;
            \$cmd\$
          );"

          echo "✓ Cron schedule créé : compute-peer-benchmarks-daily @ 0 2 * * *"

      - name: Assert Deploy Edge Functions actually ran and redeployed (a11)
        # Lot P0 (2026-08-13) : ce déploiement a échoué silencieusement à
        # l'étape "Push database migrations" pendant 4 jours (2026-08-09 à
        # 2026-08-13, drift documenté en a10) — "Deploy Edge Functions"
        # affichait `skipped`, le job entier `failure`, mais rien ne
        # traduisait ce skip en un signal impossible à rater : le run rouge
        # existait bien dans l'onglet Actions, mais aucun garde-fou ne
        # transformait son silence en incident. `if: always()` : cette
        # étape doit s'exécuter MÊME si tout ce qui précède a échoué ou a
        # été sauté, sinon elle hérite du même silence qu'elle existe pour
        # casser.
        if: always()
        run: |
          set -euo pipefail
          if [ "${{ steps.deploy_edge_functions.outcome }}" != "success" ]; then
            echo "::error::a11_deploy_edge_functions_did_not_run — 'Deploy Edge Functions' step outcome: '${{ steps.deploy_edge_functions.outcome }}' (empty means it never ran — an earlier step failed first). Code merged to main is NOT live on the Supabase project. See CLAUDE.md, section Migrations, for the incident this exact failure class caused."
            exit 1
          fi
          # Un `supabase functions deploy` qui exit 0 sans rien déployer
          # réellement (token silencieusement vide, flag mal formé...)
          # passerait le check ci-dessus sans être détecté — deuxième
          # garde, indépendante : au moins une fonction doit montrer un
          # `updated_at` réellement récent (dans les 15 dernières minutes).
          RESULT=$(curl -s -w "\n%{http_code}" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/functions" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          CODE=$(printf '%s' "$RESULT" | tail -1)
          BODY=$(printf '%s' "$RESULT" | head -1)
          if [ "$CODE" != "200" ]; then
            echo "::error::a11_deploy_edge_functions_unverifiable — could not list Edge Functions via Management API (HTTP $CODE) to confirm a real redeploy happened. Body: $BODY"
            exit 1
          fi
          NOW_S=$(date +%s)
          MOST_RECENT_MS=$(printf '%s' "$BODY" | jq -r '[.[].updated_at] | max')
          MOST_RECENT_S=$((MOST_RECENT_MS / 1000))
          AGE_S=$((NOW_S - MOST_RECENT_S))
          # Un `updated_at` ancien n'est un incident que si la CLI avait
          # réellement quelque chose à uploader. Depuis qu'elle compare le hash
          # du bundle, un push qui ne touche aucune source de fonction (une
          # migration seule, un fichier docs) affiche `No change found in
          # Function: X` pour CHAQUE fonction et ne réécrit rien — l'absence de
          # `updated_at` frais y est le comportement correct, pas un silence.
          # 2026-08-15 : ce cas exact a fait échouer le déploiement du merge
          # #75 (migration + PARKING_LOT.md uniquement, 67/67 inchangées) alors
          # que db push, a10 et a13 étaient verts.
          # La garde reste entière pour ce qu'elle vise : un token vide ou un
          # flag mal formé ne produit pas 67 lignes `No change found` — il
          # échoue, ou n'imprime rien, et les deux comptes ci-dessous divergent.
          # `grep -c` imprime déjà `0` avant de sortir en 1 sur un fichier vide :
          # `|| echo 0` y ajouterait un second `0` et casserait la comparaison
          # entière qui suit. `|| true` avale le statut sans rien imprimer, et
          # `${VAR:-0}` couvre le seul cas où stdout est réellement vide (log
          # absent — le deploy n'a jamais tourné, déjà attrapé plus haut).
          BUNDLED=$(grep -c 'Bundling Function:' /tmp/deploy-edge-functions.log 2>/dev/null || true)
          UNCHANGED=$(grep -c 'No change found in Function:' /tmp/deploy-edge-functions.log 2>/dev/null || true)
          BUNDLED=${BUNDLED:-0}
          UNCHANGED=${UNCHANGED:-0}
          if [ "$BUNDLED" -gt 0 ] && [ "$BUNDLED" -eq "$UNCHANGED" ]; then
            echo "a11: no Edge Function source changed in this push — the CLI bundled $BUNDLED function(s) and reported all $UNCHANGED unchanged, so no updated_at was rewritten (most recent is ${AGE_S}s old). Legitimate no-op, not a silent skip."
            exit 0
          fi
          if [ "$AGE_S" -gt 900 ]; then
            echo "::error::a11_deploy_edge_functions_stale — the step reported success but no Edge Function shows an updated_at within the last 15 minutes (most recent is ${AGE_S}s old), and the CLI did NOT report every function as unchanged (bundled=$BUNDLED, unchanged=$UNCHANGED). The deploy likely no-op'd silently."
            exit 1
          fi
          echo "a11: Deploy Edge Functions ran and redeployed at least one function ${AGE_S}s ago (bundled=$BUNDLED, unchanged=$UNCHANGED)."

      - name: HTTP smoke test with a real authenticated JWT (a13)
        # Incident 2026-08-13 : Overview/Accounts were down in production
        # while V.1 had been declared green on "full application cycle
        # under an authenticated JWT" — that check was only ever a SQL
        # simulation (SET LOCAL role/request.jwt.claims inside Postgres),
        # never a real HTTP request through PostgREST/an Edge Function with
        # a real token. This closes exactly that gap: a genuinely
        # GoTrue-issued access token (same admin/generate_link + /verify
        # flow used to diagnose the incident), real HTTP calls to the same
        # endpoints the 5 main screens call. 200 + non-empty body required —
        # a 200 with an empty array counts as failure on a non-empty
        # portfolio (the exact trap flagged the prior round, which then
        # materialized app-wide the same evening).
        if: always()
        run: |
          set -euo pipefail
          SR_RESP=$(curl -s -w "\n%{http_code}" "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys" -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          SR_CODE=$(printf '%s' "$SR_RESP" | tail -1)
          SR_BODY=$(printf '%s' "$SR_RESP" | head -1)
          if [ "$SR_CODE" != "200" ]; then
            echo "::error::a13_smoke_test — could not fetch service_role key (HTTP $SR_CODE), cannot run smoke test."
            exit 1
          fi
          SERVICE_ROLE_KEY=$(printf '%s' "$SR_BODY" | jq -r '.[] | select(.name == "service_role") | .api_key')
          # Compte de test existant (org "Test OAuth Corp", d3dc9223,
          # portefeuille réel non vide) — vérifié en direct dans cette
          # session sur les 4 endpoints ci-dessous avant d'écrire ce step.
          SMOKE_EMAIL="testeur-oauth@sentio-test.io"
          LINK_RESP=$(curl -s -w "\n%{http_code}" -X POST "https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1/admin/generate_link" \
            -H "Content-Type: application/json" -H "apikey: ${SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" \
            -d "{\"type\":\"magiclink\",\"email\":\"${SMOKE_EMAIL}\"}")
          LINK_CODE=$(printf '%s' "$LINK_RESP" | tail -1)
          LINK_BODY=$(printf '%s' "$LINK_RESP" | head -1)
          if [ "$LINK_CODE" != "200" ]; then
            echo "::error::a13_smoke_test — generate_link failed (HTTP $LINK_CODE) for $SMOKE_EMAIL. This user must exist (real org with accounts) for a13 to run. Body: $LINK_BODY"
            exit 1
          fi
          TOKEN_HASH=$(printf '%s' "$LINK_BODY" | jq -r '.hashed_token')
          VERIFY_RESP=$(curl -s -w "\n%{http_code}" -X POST "https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1/verify" \
            -H "Content-Type: application/json" -H "apikey: ${SERVICE_ROLE_KEY}" \
            -d "{\"type\":\"magiclink\",\"token_hash\":\"${TOKEN_HASH}\"}")
          ACCESS_TOKEN=$(printf '%s' "$VERIFY_RESP" | head -1 | jq -r '.access_token // empty')
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::error::a13_smoke_test — could not obtain a real authenticated access_token."
            exit 1
          fi
          FAILED=0
          smoke_check() {
            local NAME="$1" URL="$2"
            local RESP CODE BODY
            RESP=$(curl -s -w "\n%{http_code}" "$URL" -H "Authorization: Bearer ${ACCESS_TOKEN}")
            CODE=$(printf '%s' "$RESP" | tail -1)
            BODY=$(printf '%s' "$RESP" | head -1)
            if [ "$CODE" != "200" ]; then
              echo "::error::a13_smoke_test — $NAME returned HTTP $CODE. Body: $BODY"
              FAILED=1
              return
            fi
            if [ -z "$BODY" ] || [ "$BODY" = "null" ] || printf '%s' "$BODY" | jq -e '(.data == []) or (.data == {}) or (.data == null)' >/dev/null 2>&1; then
              echo "::error::a13_smoke_test — $NAME returned 200 with an empty body — a 200 with nothing in it is a failure on a non-empty portfolio."
              FAILED=1
              return
            fi
            echo "a13: $NAME ok (200, non-empty)."
          }
          BASE="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1"
          smoke_check "Today (get-today-actions)" "${BASE}/get-today-actions"
          smoke_check "Overview (dashboard-api/portfolio-metrics)" "${BASE}/dashboard-api/portfolio-metrics"
          smoke_check "Accounts/Segments (accounts-api)" "${BASE}/accounts-api"
          smoke_check "Playbooks (playbook-crud)" "${BASE}/playbook-crud"
          if [ "$FAILED" = "1" ]; then
            echo "::error::a13 smoke test failed — the application is not confirmed working end-to-end. A deploy is not done until this is green."
            exit 1
          fi
          echo "a13: all 5 screens confirmed working via real HTTP + real JWT."
