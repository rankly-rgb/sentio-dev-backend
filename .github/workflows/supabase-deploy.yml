name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref $SUPABASE_PROJECT_REF

      - name: Repair remote-only migration versions
        # Versions présentes en remote sans fichier local (migrations appliquées
        # directement sur le projet). Les marquer comme "reverted" dans l'historique
        # pour que db push ne bloque pas sur le mismatch.
        run: |
          REMOTE_ONLY=$(supabase migration list 2>/dev/null | awk -F'|' '
            /[0-9]{14}/ {
              local=$1; gsub(/[ \t]/, "", local)
              remote=$2; gsub(/[ \t]/, "", remote)
              if (local == "" && remote ~ /^[0-9]{14}$/) print remote
            }
          ')
          if [ -n "$REMOTE_ONLY" ]; then
            echo "Remote-only versions à réparer :"
            echo "$REMOTE_ONLY"
            while IFS= read -r version; do
              [ -n "$version" ] && supabase migration repair --status reverted "$version"
            done <<< "$REMOTE_ONLY"
          else
            echo "Aucune version remote-only — historique cohérent."
          fi

      - name: Push database migrations
        run: supabase db push --include-all

      - name: Set Edge Function secrets
        # N'écrit que les secrets effectivement définis dans GitHub Secrets.
        # Évite d'écraser un secret existant avec une chaîne vide si le
        # GitHub Secret correspondant est absent.
        run: |
          ARGS=""
          [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]       && ARGS="$ARGS ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}"
          [ -n "${{ secrets.STRIPE_SECRET_KEY }}" ]        && ARGS="$ARGS STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}"
          [ -n "${{ secrets.STRIPE_WEBHOOK_SECRET }}" ]    && ARGS="$ARGS STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }}"
          if [ -n "$ARGS" ]; then
            supabase secrets set $ARGS
          else
            echo "No secrets to update."
          fi

      - name: Deploy Edge Functions
        run: supabase functions deploy

      - name: Schedule compute-peer-benchmarks (daily 02:00 UTC)
        # Récupère la service_role key via la Management API, puis crée/remplace
        # le job pg_cron via une query SQL. Idempotent.
        # Soft-fail avec warning si la clé est inaccessible (ne bloque pas le deploy).
        run: |
          set -euo pipefail

          # ── 1. Récupérer la service_role key ──────────────────────────
          RESP=$(curl -s -w "\n%{http_code}" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/api-keys" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          HTTP_CODE=$(printf '%s' "$RESP" | tail -1)
          BODY=$(printf '%s' "$RESP" | head -1)

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Management API /api-keys returned HTTP $HTTP_CODE — cron non configuré"
            echo "Body: $BODY"
            exit 0
          fi

          SERVICE_ROLE_KEY=$(printf '%s' "$BODY" \
            | jq -r '.[] | select(.name == "service_role") | .api_key')

          if [ -z "$SERVICE_ROLE_KEY" ]; then
            echo "::warning::service_role key introuvable dans la réponse — cron non configuré"
            exit 0
          fi

          FUNCTION_URL="https://${SUPABASE_PROJECT_REF}.supabase.co/functions/v1/compute-peer-benchmarks"

          # ── 2. Helper : exécuter du SQL via la Management API ─────────
          run_sql() {
            local SQL_BODY
            SQL_BODY=$(jq -Rcs '{"query":.}' <<< "$1")
            RESULT=$(curl -s -w "\n%{http_code}" -X POST \
              "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$SQL_BODY")
            local CODE
            CODE=$(printf '%s' "$RESULT" | tail -1)
            local OUT
            OUT=$(printf '%s' "$RESULT" | head -1)
            echo "SQL HTTP $CODE : $OUT"
            [ "$CODE" = "200" ] || [ "$CODE" = "201" ]
          }

          # ── 3. Supprimer l'ancien job s'il existe ─────────────────────
          run_sql "select cron.unschedule('compute-peer-benchmarks-daily');" || true

          # ── 4. Créer le job pg_cron ───────────────────────────────────
          run_sql "select cron.schedule(
            'compute-peer-benchmarks-daily',
            '0 2 * * *',
            \$cmd\$
              select net.http_post(
                url        := '${FUNCTION_URL}',
                headers    := '{\"Content-Type\":\"application/json\",\"Authorization\":\"Bearer ${SERVICE_ROLE_KEY}\"}'::jsonb,
                body       := '{}'::jsonb
              ) as request_id;
            \$cmd\$
          );"

          echo "✓ Cron schedule créé : compute-peer-benchmarks-daily @ 0 2 * * *"
