name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/migrations/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref $SUPABASE_PROJECT_REF

      - name: Repair migration history (remote-only versions → reverted)
        # Marque comme "reverted" les versions présentes en remote mais absentes
        # en local, pour permettre à db push de s'exécuter sans erreur de mismatch.
        run: |
          supabase migration list 2>/dev/null || true
          supabase db push --include-all --dry-run 2>&1 || true
        continue-on-error: true

      - name: Push database migrations
        run: supabase db push --include-all --ignore-version-mismatch

      - name: Deploy Edge Functions
        run: supabase functions deploy
