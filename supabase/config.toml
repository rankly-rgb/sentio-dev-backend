# ============================================================
# Lot 8 (2026-08-15) — les 9 fonctions rapatriées d'un déploiement
# hors git (issue #55). Chaque valeur ci-dessous REPRODUIT la valeur
# `verify_jwt` réellement en place sur le projet au moment du
# rapatriement (relevée via list_edge_functions) — ce n'est pas un
# choix de conception fait ici.
#
# Sans ces blocs, `supabase functions deploy` appliquerait son défaut
# (`verify_jwt = true`) à ces 9 fonctions au premier déploiement qui
# les inclut, ce qui casserait les 8 qui vérifient elles-mêmes un JWT
# ES256 dans leur code (verify_jwt=true rejette ES256 — cf. en-tête de
# _shared/auth.ts).
# ============================================================

