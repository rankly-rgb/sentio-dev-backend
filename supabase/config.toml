# Supabase project configuration
# Ref : https://supabase.com/docs/guides/cli/config

# stripe-webhook : pas de vérification JWT (Stripe signe ses propres requêtes via HMAC)
[functions.stripe-webhook]
verify_jwt = false

# track-usage : pas de JWT (endpoints publics SDK clients)
[functions.track-usage]
verify_jwt = false

# sync-stripe : déclenché par cron ou manuellement (service_role)
[functions.sync-stripe]
verify_jwt = true

# calculate-scores : déclenché par cron (service_role)
[functions.calculate-scores]
verify_jwt = true

# playbook-crud : JWT vérifié dans le code (ES256 incompatible avec verify_jwt)
[functions.playbook-crud]
verify_jwt = false

# playbook-execute : JWT vérifié dans le code (ES256 incompatible avec verify_jwt)
[functions.playbook-execute]
verify_jwt = false

# playbook-scheduler : cron (service_role HS256, compatible verify_jwt)
[functions.playbook-scheduler]
verify_jwt = true

# admin-proxy : JWT vérifié dans le code (ES256 incompatible avec verify_jwt)
# Proxy sécurisé pour déclencher sync-stripe, calculate-scores, etc.
[functions.admin-proxy]
verify_jwt = false

# health-check : monitoring externe (pas de JWT, GET public)
[functions.health-check]
verify_jwt = false

# workflow-step-processor : cron (service_role HS256, traite les steps workflow en attente)
[functions.workflow-step-processor]
verify_jwt = true

# generate-insights : cron (service_role HS256, génération quotidienne d'insights)
[functions.generate-insights]
verify_jwt = true

# insights-crud : JWT vérifié dans le code (ES256 incompatible avec verify_jwt)
[functions.insights-crud]
verify_jwt = false

# self-monitor : cron interne (service_role HS256)
[functions.self-monitor]
verify_jwt = true

# export-playbook-accounts : JWT vérifié dans le code (ES256 incompatible avec verify_jwt)
[functions.export-playbook-accounts]
verify_jwt = false

# export-segment-csv : JWT vérifié dans le code (ES256 incompatible avec verify_jwt)
[functions.export-segment-csv]
verify_jwt = false

# webhook-config : JWT vérifié dans le code (ES256 incompatible avec verify_jwt)
# Routes : GET/POST /, POST /test, POST /regenerate-secret, POST /disable
[functions.webhook-config]
verify_jwt = false

# sync-hubspot : JWT vérifié dans le code (appelé par cron service_role + triggerInitialSync)
[functions.sync-hubspot]
verify_jwt = false

# refresh-hubspot-tokens : cron (service_role HS256, refresh 6h tokens)
[functions.refresh-hubspot-tokens]
verify_jwt = true

# integration-oauth : JWT vérifié dans le code pour authorize/status/revoke
# Callbacks OAuth (redirect browser) protégés par state CSRF, pas de JWT
[functions.integration-oauth]
verify_jwt = false
