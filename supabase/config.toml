# Supabase project configuration
# Ref : https://supabase.com/docs/guides/cli/config
# Last deploy trigger : 2026-05-02T08:30

# stripe-webhook : pas de vérification JWT (Stripe signe ses propres requêtes via HMAC)
[functions.stripe-webhook]
verify_jwt = false

# track-usage : pas de JWT (endpoints publics SDK clients)
[functions.track-usage]
verify_jwt = false

# sync-stripe : déclenché par cron ou manuellement (service_role)
[functions.sync-stripe]
verify_jwt = true

# sync-hubspot : appelé depuis admin-proxy ou hubspot-connect (service_role Bearer)
# verify_jwt=false : admin-proxy fait déjà l'auth ES256 en amont
[functions.sync-hubspot]
verify_jwt = false

# calculate-scores : déclenché par cron (service_role)
[functions.calculate-scores]
verify_jwt = true

# playbook-crud : JWT vérifié dans le code (ES256 incompatible avec verify_jwt)
[functions.playbook-crud]
verify_jwt = false

# playbook-execute : JWT vérifié dans le code (ES256 incompatible avec verify_jwt)
[functions.playbook-execute]
verify_jwt = false

# playbook-scheduler : cron (service_role HS256, compatible verify_jwt)
[functions.playbook-scheduler]
verify_jwt = true

# admin-proxy : JWT vérifié dans le code (ES256 incompatible avec verify_jwt)
# Proxy sécurisé pour déclencher sync-stripe, calculate-scores, etc.
[functions.admin-proxy]
verify_jwt = false

